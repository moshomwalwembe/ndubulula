<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ndubulula Digital Dynamics</title>

  <!-- Red Gradient Circle Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23FF4D4D;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%23D90429;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='16' fill='url(%23grad)' /%3E%3C/svg%3E" />

  <script>
    // Inline script to prevent theme flash (FOUT)
    // Default to dark mode unless 'light' is explicitly stored in localStorage
    if (localStorage.getItem('color-theme') === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              red: '#D90429', // Crimson/Firebrick shade
              darkRed: '#8D0000',
            },
            neutral: {
              black: '#0A0A0A', // Rich Black
              white: '#FFFFFF',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          animation: {
            'grid-flow': 'gridFlow 20s linear infinite',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            gridFlow: {
              '0%': { transform: 'translateY(0)' },
              '100%': { transform: 'translateY(50px)' },
            }
          }
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      transition: background-color 300ms ease, color 300ms ease;
    }

    html.dark body {
      background-color: #0A0A0A;
      color: #FFFFFF;
    }

    html:not(.dark) body {
      background-color: #F9FAFB;
      color: #111827;
    }

    /* Admin Panel Light Mode Styling Overrides */
    html:not(.dark) .admin-container {
      background-color: #F9FAFB !important;
      color: #1F2937 !important;
    }

    html:not(.dark) .admin-container h1,
    html:not(.dark) .admin-container h2,
    html:not(.dark) .admin-container h3,
    html:not(.dark) .admin-container h4,
    html:not(.dark) .admin-container th {
      color: #111827 !important;
    }

    html:not(.dark) .admin-container p,
    html:not(.dark) .admin-container span,
    html:not(.dark) .admin-container td,
    html:not(.dark) .admin-container label,
    html:not(.dark) .admin-container textarea,
    html:not(.dark) .admin-container input {
      color: #374151 !important;
    }

    html:not(.dark) .text-white {
      color: #111827 !important;
    }

    html:not(.dark) .text-gray-400,
    html:not(.dark) .text-gray-300,
    html:not(.dark) .text-gray-500 {
      color: #4B5563 !important;
    }

    /* Force text white inside primary red components/buttons and their children, and keep red background */
    html:not(.dark) .bg-primary-red,
    html:not(.dark) button.bg-primary-red,
    html:not(.dark) .bg-primary-red * {
      color: #FFFFFF !important;
    }
    
    html:not(.dark) .bg-primary-red {
      background-color: #D90429 !important;
    }

    /* Cards, Modals, Popups, and Headers Background overrides */
    html:not(.dark) .bg-neutral-900,
    html:not(.dark) [class*="bg-neutral-900"],
    html:not(.dark) [class*="bg-neutral-955"],
    html:not(.dark) [class*="bg-neutral-950"],
    html:not(.dark) [class*="bg-neutral-800"],
    html:not(.dark) [class*="bg-[#111]"],
    html:not(.dark) [class*="bg-black/50"],
    html:not(.dark) aside,
    html:not(.dark) header {
      background-color: #FFFFFF !important;
    }

    /* Slightly gray backgrounds (lists, table headers, pagination footers, hovered items, inactive tab buttons) */
    html:not(.dark) [class*="bg-black/40"],
    html:not(.dark) [class*="bg-white/5"],
    html:not(.dark) [class*="bg-neutral-900/50"],
    html:not(.dark) [class*="bg-neutral-800/50"],
    html:not(.dark) [class*="bg-neutral-700/50"] {
      background-color: #F3F4F6 !important;
    }

    html:not(.dark) button[class*="bg-black/50"],
    html:not(.dark) button[class*="bg-white/5"] {
      background-color: #F3F4F6 !important;
    }

    /* Active selected tabs (e.g. bg-white/10 text-white) override to distinct pill */
    html:not(.dark) [class*="bg-white/10"] {
      background-color: #E5E7EB !important;
      color: #111827 !important;
    }

    html:not(.dark) [class*="bg-white/10"] * {
      color: #111827 !important;
    }

    html:not(.dark) .bg-gradient-to-r.from-neutral-900 {
      background-image: none !important;
      background-color: #FFFFFF !important;
    }

    /* Input Controls */
    html:not(.dark) input,
    html:not(.dark) textarea,
    html:not(.dark) select {
      background-color: #FFFFFF !important;
      color: #111827 !important;
      border-color: #D1D5DB !important;
    }

    html:not(.dark) select option {
      background-color: #FFFFFF !important;
      color: #111827 !important;
    }

    /* Borders overrides */
    html:not(.dark) [class*="border-neutral-"],
    html:not(.dark) [class*="border-white/"],
    html:not(.dark) [class*="divide-white/"] > *,
    html:not(.dark) td,
    html:not(.dark) th {
      border-color: #E5E7EB !important;
    }

    /* Hover States overrides */
    html:not(.dark) [class*="hover:bg-white/5"]:hover,
    html:not(.dark) [class*="hover:bg-white/10"]:hover,
    html:not(.dark) [class*="hover:bg-neutral-800"]:hover,
    html:not(.dark) [class*="hover:bg-neutral-700"]:hover,
    html:not(.dark) [class*="hover:bg-neutral-250"]:hover,
    html:not(.dark) [class*="hover:bg-neutral-800/50"]:hover,
    html:not(.dark) .group:not(.bg-primary-red):hover {
      background-color: #F3F4F6 !important;
    }

    html:not(.dark) [class*="hover:text-white"]:hover {
      color: #111827 !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    html.dark ::-webkit-scrollbar-track {
      background: #0A0A0A;
    }

    html:not(.dark) ::-webkit-scrollbar-track {
      background: #F9FAFB;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #D90429;
    }
  </style>
